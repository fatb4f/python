name: Validate Python Immersion

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v3
      - run: uv lock --check
      - run: uv sync --locked
      - run: >-
          uv run --frozen --no-sync python -c
          "import sys; assert sys.implementation.name == 'cpython';
          assert sys.version_info[:2] == (3, 14)"
      - run: >-
          uv run --frozen --no-sync python -c
          "from rich import inspect as rich_inspect;
          assert callable(rich_inspect)"
      - run: uv run --frozen --no-sync python -m compileall -q specimens
      - run: just test
