[project]
name = "python-immersion"
version = "0.1.0"
description = "Semantic practice and inspectable Python projects"
requires-python = ">=3.14,<3.15"
dependencies = [
  "rich>=15.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["tests"]

[tool.uv]
package = false
